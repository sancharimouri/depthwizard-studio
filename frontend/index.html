        <section class="statement" aria-label="Why height matters">
          <p class="statement__text">Topography dictates the flow of water, the stability of slopes, and the potential of urban development. However, the only open-access global elevation dataset remains limited to a coarse <span class="statement__em">30-meter</span> resolution.</p>
        </section>
        <section class="problem" aria-labelledby="problem-title">
          <header class="sec-head sec-head--full">
            <p class="eyebrow fade-up">01 / The problem</p>
            <h2 class="h2" id="problem-title" style="--i:1">Height is the missing layer</h2>
            <p class="lead fade-up" style="--i:2">Satellites photograph the planet every few days. Turning those pictures into reliable height is still slow, expensive or out of reach for most people who need it.</p>
          </header>
          <ul class="problem__cards" role="list">
            <li class="card fade-up" style="--i:3"><p class="card__meta"><span>Coarse</span><span>[01]</span></p><p class="card__body">Open global elevation models are 30 m per pixel, blurring the ground. A building, a terrace or a river bank disappears inside one cell.</p></li>
            <li class="card fade-up" style="--i:4"><p class="card__meta"><span>Expensive</span><span>[02]</span></p><p class="card__body">Lidar measures height precisely, but every survey needs aircraft, permits and budget. Most of India has no open lidar at all.</p></li>
            <li class="card fade-up" style="--i:5"><p class="card__meta"><span>Demanding</span><span>[03]</span></p><p class="card__body">Stereo needs a perfect pair. Photogrammetry needs two overlapping images taken at matched angles. Usually you have one.</p></li>
            <li class="card fade-up" style="--i:6"><p class="card__meta"><span>Unchecked</span><span>[04]</span></p><p class="card__body">Off-the-shelf depth models draw convincing relief, but not in meters, and it is rarely checked against the ground.</p></li>
          </ul>
        </section>

          </header>
          <ol class="pipe" role="list">
            <li class="pipe__node fade-up" style="--i:3"><span class="pipe__num">01</span><h3 class="h3">Ingest</h3><span class="chip-stack"><span class="chip">GeoTIFF</span><span class="chip">Copernicus Data Space</span></span></li>
            <li class="pipe__node fade-up" style="--i:4"><span class="pipe__num">02</span><h3 class="h3">Ground</h3><span class="chip-stack"><span class="chip">SRTM</span></span></li>

            <li class="pipe__node fade-up" style="--i:6"><span class="pipe__num">04</span><h3 class="h3">Calibrate</h3><span class="chip-stack"><span class="chip">ICESat-2</span></span></li>
            <li class="pipe__node fade-up" style="--i:7"><span class="pipe__num">05</span><h3 class="h3">Compose and explore</h3><span class="chip-stack"><span class="chip-row"><span class="chip">Three.js</span><span class="chip">ThinkHazard</span></span><span class="chip">Wikidata</span></span></li>
          </ol>

            <div class="stat"><p class="stat__num" data-count="19.3" data-unit=" s">19.3 s</p><p class="stat__label">Sentinel-2 search with place facts (median)</p></div>

          <p class="source">Measured on the production backend, Google Cloud Run, Mumbai region.</p>
          <header class="sec-head sec-head--full sub-head evidence">
            <h2 class="h2" id="evidence-title">Measured, not claimed</h2>
            <p class="lead fade-up" style="--i:2">To prevent spatial data leakage, our evaluation data is strictly split by geographic location and was completely excluded from model training. In the interest of full transparency, we publish all performance metrics, including our negative results.</p>
          </header>
          <div class="block">
            <div class="block__aside fade-up">
              <h3 class="h3 block__title block__title--a">Height from a single image, against airborne lidar</h3>
              <p class="caption caption--line">Depth Wizard engine, IEEE GRSS DFC2019, 50 tiles, 4-fold spatial-quadrant hold-out, mean ± s.d. over three training seeds.</p>
            </div>
            <div class="stats stats--4">
              <div class="stat"><p class="stat__num" data-count="0.072" data-unit=" m">0.072 m</p><p class="stat__label">Mean absolute error (±0.01)</p></div>
              <div class="stat"><p class="stat__num" data-count="0.100" data-unit=" m">0.100 m</p><p class="stat__label">Root-mean-square error (±0.03)</p></div>
              <div class="stat"><p class="stat__num" data-count="0.991">0.991</p><p class="stat__label">Pearson correlation</p></div>
              <div class="stat"><p class="stat__num" data-count="0.916">0.916</p><p class="stat__label">Spearman correlation</p></div>
            </div>
            <div class="chart" data-chart="matrix"></div>
            <p class="caption caption--note">Oracle-calibrated depth is Depth Anything V2 fitted to each tile's lidar using the true answers. It is the best a generic depth model can do.</p>
            <p class="callout callout--a">Depth Wizard beats a baseline that is allowed to see the answers, on all four metrics.</p>

        <article class="docs">

            <header class="docs-hero">
                <div class="docs-eyebrow">DOCUMENTATION</div>
                <h1>What Depth Wizard does — and what it doesn’t</h1>
                <p class="docs-lede">
                    Depth Wizard turns satellite imagery into an interactive 3D terrain view. The terrain you see is
                    always a real digital elevation model (DEM). Satellite imagery is draped on it as texture, and the
                    output of a depth model (Depth Anything V2) is shown only as a labelled <em>relative-depth</em>
                    visualisation — never as measured height.
                </p>
            </header>

            <nav class="docs-toc" aria-label="On this page">
                <a href="/#demo-video">Demo video</a> <!-- the PERMANENT #demo-video anchor is on Home -->
                <a href="#docs-pages">The three pages</a>
                <a href="#docs-heights">Where the heights come from</a>
                <a href="#docs-credits">Data sources &amp; credits</a>
                <a href="#docs-research">What the research found</a>
                <a href="#docs-limits">Coverage and limits</a>
            </nav>

            <section id="docs-pages" class="docs-section">
                <h2>The three pages</h2>

                <div class="docs-cards">
                    <div class="docs-card">
                        <div class="docs-card-num">1</div>
                        <h3>DW Studio</h3>
                        <ul>
                            <li><strong>Choose from Library</strong>: 88 curated real scenes (6 Maxar VHR, 50 DFC2019,
                                32 Sentinel-2) with their source, ground resolution and location.</li>
                            <li><strong>Upload</strong> a GeoTIFF, PNG or JPG. A GeoTIFF’s ground resolution is read from its
                                geotransform: at 2.4 m/pixel or finer it is routed to Tier 2 (height prediction) and you
                                upload a DEM or have FABDEM fetched; coarser goes to Tier 1 (FABDEM terrain only, fetched
                                automatically). PNG/JPG has no location, so only the relative preview applies.</li>
                            <li><strong>Search Online</strong> queries the Copernicus Data Space Ecosystem live for
                                Sentinel-2 L2A scenes (always Tier 1, FABDEM fetched automatically). It shows the account’s
                                documented quota and this app’s own usage, and you can use your own Copernicus key.</li>
                            <li>The <strong>Start generation</strong> button is green for Tier 2, orange for Tier 1.</li>
                            <li>Each start is a <strong>job</strong>. <strong>Generate New</strong> starts another without
                                closing the current one. The jobs panel lists them newest first, and the 3D view has a tab
                                per job. Each job can be saved, pinned or deleted. <strong>Save</strong> downloads the job as
                                JSON and keeps a copy under <strong>Saved</strong> in this browser, where it can be
                                reopened later. Unsaved jobs live only in this tab, and leaving with any asks first. The
                                panel icon hides or shows the jobs panel.</li>
                            <li><strong>Start generation</strong> generates from your scene: relative depth
                                (Depth Anything V2 Small) from the image itself, and elevation, the DSM and the 3D terrain
                                from a real elevation model for its footprint: FABDEM and Copernicus GLO-30 for library
                                Sentinel-2 tiles, a DEM you attach, or GLO-30 fetched live. Height is never inferred
                                from the image. A scene without a georeference (DFC2019 tiles, plain PNG/JPG) has no
                                elevation, and the panels say so.</li>
                        </ul>
                    </div>

            <section id="docs-heights" class="docs-section">
                <h2>Where the heights come from</h2>
                <p>
                    Every 3D surface in the app is a DEM. The three plains regions use Copernicus GLO-30 at 30 m, so
                    they read less detailed than Darjeeling — that is the data, not a bug.
                </p>
                <div class="docs-table-wrap">
                    <table class="docs-table">
                        <thead>
                            <tr><th>Region</th><th>Terrain source</th><th>Elevation range</th><th>Landscape</th></tr>
                        </thead>
                        <tbody>
                            <tr><td>Connaught Place</td><td>FABDEM + Open Buildings 2023 heights</td><td>214–308 m</td><td>dense urban</td></tr>
                            <tr><td>Darjeeling</td><td>Copernicus GLO-30</td><td>240–2614 m</td><td>hilly, forested</td></tr>
                            <tr><td>Lavaux</td><td>swissSURFACE3D / swissALTI3D 0.5 m</td><td>372–712 m</td><td>terraced vineyards, lakeshore</td></tr>
                            <tr><td>Gulf of Kutch</td><td>FABDEM, offset-calibrated to ICESat-2</td><td>0–6 m</td><td>tidal mudflats</td></tr>
                        </tbody>
                    </table>
                </div>
                <p>
                    <strong>Relative depth</strong> is frozen Depth Anything V2 (ViT-Large). It orders pixels
                    near-to-far; it has no metres. On nadir satellite imagery it does not reliably track elevation:
                    on Darjeeling its correlation with the DEM flipped from +0.60 to −0.41 once the broad spatial trend
                    was removed.
                </p>
                <p class="docs-credit">
                    <strong>Credits.</strong> DFC2019 library tiles: IEEE GRSS Data Fusion Contest 2019 (Track 1),
                    from the JHU/APL Urban Semantic 3D (US3D) dataset.
                </p>
            </section>

            <section id="docs-research" class="docs-section">
                <h2>What the research found</h2>
                <p>
                    Alongside the app, a research track tested whether real metric height can be predicted from
                    imagery. The short answer depends on resolution.
                </p>
                <div class="docs-tiers">
                    <div class="docs-tier">
                        <div class="docs-tier-tag">SENTINEL-2 · 10 m · IN THE APP</div>
                        <h3>DEM only</h3>
                        <p>
                            Across 32 Indian test tiles, nothing tested on top of the imagery (frequency fusion,
                            random-forest and linear residuals, CNN corrections, a fine-tuned depth model, a ranking
                            loss) beat simply using the DEM. The best terrain DEM
                            is <strong>FABDEM</strong> — median error 1.78 m against ICESat-2 ground photons — and the
                            best surface DEM is <strong>Copernicus GLO-30</strong> (4.48 m median against canopy-top
                            segments). A second coarse sensor (Landsat, 15 m) behaved the same way.
                        </p>
                    </div>
                    <div class="docs-tier">
                        <div class="docs-tier-tag">VERY HIGH RESOLUTION · ~0.3 m · RESEARCH ONLY</div>
                        <h3>Predicted height, gated on imagery</h3>
                        <p>
                            On 0.3 m imagery (the DFC2019 benchmark) a fine-tuned Depth Anything V2 does beat a strong
                            per-tile baseline (MAE 1.98 m, RMSE 3.49 m). An offline pipeline builds
                            DSM = FABDEM + predicted height above ground and was run on 6 Maxar crops in Sikkim and
                            Darjeeling. In the app it is used <strong>only</strong> as the surface model of those 6 Maxar
                            library crops (precomputed, labelled as a research model). It under-states tall canopy (a ceiling
                            around 18–23 m), it did not generalise to US aerial imagery, and it has only been tested on
                            mountain terrain.
                        </p>
                    </div>
                </div>
                <p class="docs-note">
                    In synthetic tests, a model trained on imagery coarsened to 5 m still clearly beat the baseline;
                    from 6 m on it no longer did. That is why learned height is tied to very-high-resolution imagery
                    and not to Sentinel-2.
                </p>
            </section>

                    coastal or urban very-high-resolution areas have been tested yet.
