name: freeze-trial
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  freeze:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only torch from the PyTorch CPU index)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r desktop/freeze_trial/requirements-freeze.txt
          python -c "import torch; print('torch', torch.__version__, 'cuda built:', torch.backends.cuda.is_built())"
      - name: Model + test inputs
        run: python desktop/freeze_trial/ci_prepare.py work
      - name: Build (full = all macOS fixes)
        run: python desktop/freeze_trial/build_freeze.py --root . --hf work/hf --out out-full --variant full
      - name: Build (without --collect-submodules rasterio)
        run: python desktop/freeze_trial/build_freeze.py --root . --hf work/hf --out out-norast --variant no-rasterio-submodules
      - name: Checks
        run: |
          EXE=dw2-backend; [ "$RUNNER_OS" = "Windows" ] && EXE=dw2-backend.exe
          IMG=work/sentinel2-almora__preview.jpg; TIF=work/sentinel2-almora.tif
          mkdir -p results
          python desktop/freeze_trial/ci_check.py out-full/dist/dw2-backend/$EXE $IMG $TIF full | tee -a results/checks.jsonl
          python desktop/freeze_trial/ci_check.py out-full/dist/dw2-backend/$EXE $IMG $TIF full-without-freeze_support --skip-freeze-support | tee -a results/checks.jsonl
          python desktop/freeze_trial/ci_check.py out-norast/dist/dw2-backend/$EXE $IMG $TIF without-rasterio-submodules | tee -a results/checks.jsonl
          python desktop/freeze_trial/ci_size.py out-full/dist/dw2-backend | tee results/size.json
      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat results/checks.jsonl results/size.json >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: results/
