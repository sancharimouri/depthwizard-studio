name: freeze-trial
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  freeze:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export DAv2-Small to ONNX (throwaway venv with CPU torch; torch is NOT in the build)
        run: |
          python -m venv exportenv
          EXPY=exportenv/bin/python; [ "$RUNNER_OS" = "Windows" ] && EXPY=exportenv/Scripts/python.exe
          $EXPY -m pip install --upgrade pip
          $EXPY -m pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          $EXPY -m pip install transformers==5.17.0 safetensors==0.8.0 huggingface-hub==1.30.0 onnx pillow
          $EXPY desktop/freeze_trial/ci_prepare.py work
          $EXPY desktop/freeze_trial/export_onnx.py work/dav2_small.onnx work/hf
      - name: Install build deps (no torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/freeze_trial/requirements-freeze.txt
          python -c "import importlib.util as u; assert u.find_spec('torch') is None; print('no torch in the build env')"
      - name: Build (full = all macOS fixes)
        run: python desktop/freeze_trial/build_freeze.py --root . --onnx work/dav2_small.onnx --out out-full --variant full
      - name: Build (without --collect-submodules rasterio)
        run: python desktop/freeze_trial/build_freeze.py --root . --onnx work/dav2_small.onnx --out out-norast --variant no-rasterio-submodules
      - name: Checks
        run: |
          EXE=dw2-backend; [ "$RUNNER_OS" = "Windows" ] && EXE=dw2-backend.exe
          IMG=work/sentinel2-almora__preview.jpg; TIF=work/sentinel2-almora.tif
          mkdir -p results
          python desktop/freeze_trial/ci_check.py out-full/dist/dw2-backend/$EXE $IMG $TIF full | tee -a results/checks.jsonl
          python desktop/freeze_trial/ci_check.py out-full/dist/dw2-backend/$EXE $IMG $TIF full-without-freeze_support --skip-freeze-support | tee -a results/checks.jsonl
          python desktop/freeze_trial/ci_check.py out-norast/dist/dw2-backend/$EXE $IMG $TIF without-rasterio-submodules | tee -a results/checks.jsonl
          python desktop/freeze_trial/ci_size.py out-full/dist/dw2-backend | tee results/size.json
      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat results/checks.jsonl results/size.json >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: results/
